name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure isolated build credentials
        run: node scripts/configure-ci-build-env.mjs

      - name: Generate and validate Prisma client
        run: npm run prisma:generate && npm run prisma:validate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: Validate generated OpenAPI and UI budgets
        run: npm run openapi:check && npm run ui:check

      - name: Build
        run: npm run build

      - name: Audit publishable files and production dependencies
        run: npm run audit:public

      - name: Reject vulnerabilities at every severity, including development dependencies
        run: npm run audit:strict

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXTAUTH_URL: "http://127.0.0.1:3100"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Start SQL Server with credentials generated for this run
        run: bash scripts/start-ci-sqlserver.sh

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Bootstrap and seed browser database
        run: npm run db:bootstrap && npm run prisma:seed

      - name: Run browser, accessibility, mobile, cache-isolation, and visual tests
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Stop the disposable SQL Server
        if: always()
        run: |
          if docker inspect nest-ci-sqlserver > /dev/null 2>&1; then
            docker stop nest-ci-sqlserver
          fi

  sqlserver-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_PHASE4_DB_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Start SQL Server with credentials generated for this run
        run: bash scripts/start-ci-sqlserver.sh

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap empty SQL Server from the retained baseline
        run: npm run db:bootstrap

      - name: Seed database
        run: npm run prisma:seed

      - name: Exercise database integrity constraints
        run: node --import tsx --test tests/phase4-database-integrity.integration.test.mjs

      - name: Exercise ledger concurrency and idempotency
        env:
          RUN_PHASE1_DB_TESTS: "true"
        run: node --import tsx --test tests/phase1-concurrency.integration.test.mjs

      - name: Verify forward deploy is idempotent
        run: npm run prisma:migrate:deploy

      - name: Stop the disposable SQL Server
        if: always()
        run: |
          if docker inspect nest-ci-sqlserver > /dev/null 2>&1; then
            docker stop nest-ci-sqlserver
          fi

  sonarqube:
    name: SonarQube strict AI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_HOST_URL: http://127.0.0.1:9000
      SONAR_DISPOSABLE: "true"
    steps:
      - name: Check out the complete change and history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure isolated build credentials
        run: node scripts/configure-ci-build-env.mjs

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Install verified SonarScanner CLI
        run: bash scripts/install-sonar-scanner.sh

      - name: Measure coverage across all production sources
        run: npm run test:coverage

      - name: Start an isolated SonarQube Community server
        run: |
          sudo sysctl -w vm.max_map_count=524288
          docker run --detach --name nest-sonarqube --publish 127.0.0.1:9000:9000 \
            sonarqube:26.9.0.129388-community@sha256:4905574ab8584dcac1a06c01cdc43a4ce9e369723ac4a7ab1d029c1bf71e6fe9
          node scripts/sonar-ci-bootstrap.mjs

      - name: Apply and verify the versioned Nest policy
        run: npm run sonar:configure

      - name: Analyze and enforce the quality gate
        # Community analyzes this checkout as a complete main project. No licensed PR parameters are used.
        run: npm run sonar:scan

      - name: Preserve coverage and quality gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strict-quality-results
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Collect server diagnostics and stop the disposable server
        if: always()
        run: |
          if docker inspect nest-sonarqube > /dev/null 2>&1; then
            docker logs nest-sonarqube
            docker stop nest-sonarqube
          fi

  security:
    uses: ./.github/workflows/security.yml

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
      packages: read

  quality-gate:
    name: Strict quality gate
    if: always()
    needs: [validate, browser, sqlserver-baseline, sonarqube, security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality and security job to succeed
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = JSON.parse(process.env.REQUIRED_JOBS);
            const failed = Object.entries(jobs).filter(([, job]) => job.result !== "success");
            for (const [name, job] of failed) console.error(`${name}: ${job.result}`);
            if (failed.length) process.exit(1);
            console.log("Every required quality and security job passed.");
          '
