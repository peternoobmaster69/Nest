name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Prisma client
        run: npm run prisma:generate && npm run prisma:validate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: Validate generated OpenAPI and UI budgets
        run: npm run openapi:check && npm run ui:check

      - name: Build
        run: npm run build

      - name: Audit publishable files and production dependencies
        run: npm run audit:public

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: NestCi_2026_Strong
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P NestCi_2026_Strong -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=master;user=sa;password=NestCi_2026_Strong;encrypt=true;trustServerCertificate=true"
      SHADOW_DATABASE_URL: "sqlserver://localhost:1433;database=master;user=sa;password=NestCi_2026_Strong;encrypt=true;trustServerCertificate=true"
      NEXTAUTH_URL: "http://127.0.0.1:3100"
      NEXTAUTH_SECRET: "phase9-ci-only-secret-with-at-least-32-characters"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Bootstrap and seed browser database
        run: npm run db:bootstrap && npm run prisma:seed

      - name: Run browser, accessibility, mobile, cache-isolation, and visual tests
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  sqlserver-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: NestCi_2026_Strong
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P NestCi_2026_Strong -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=master;user=sa;password=NestCi_2026_Strong;encrypt=true;trustServerCertificate=true"
      SHADOW_DATABASE_URL: "sqlserver://localhost:1433;database=master;user=sa;password=NestCi_2026_Strong;encrypt=true;trustServerCertificate=true"
      RUN_PHASE4_DB_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap empty SQL Server from the retained baseline
        run: npm run db:bootstrap

      - name: Seed database
        run: npm run prisma:seed

      - name: Exercise database integrity constraints
        run: node --import tsx --test tests/phase4-database-integrity.integration.test.mjs

      - name: Exercise ledger concurrency and idempotency
        env:
          RUN_PHASE1_DB_TESTS: "true"
        run: node --import tsx --test tests/phase1-concurrency.integration.test.mjs

      - name: Verify forward deploy is idempotent
        run: npm run prisma:migrate:deploy
