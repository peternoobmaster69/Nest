<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nest — Screen Proposals</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;

  --brand-50: #edfaf3;
  --brand-100: #c6f0d9;
  --brand-200: #8eddb8;
  --brand-300: #52c490;
  --brand-400: #27a96d;
  --brand-500: #1a8f58;
  --brand-600: #147349;
  --brand-700: #0f5737;
  --brand-800: #0a3d27;

  --teal: #3aada6;
  --peach: #f0926a;
  --lime: #8cc832;
  --accent-500: #d97706;

  --bg-base: #f5f2ed;
  --bg-surface: #fdfcfa;
  --bg-elevated: #ffffff;
  --bg-subtle: #eae6de;

  --text-primary: #1c1916;
  --text-secondary: #4a4540;
  --text-tertiary: #78716c;
  --text-disabled: #a8a29e;

  --border-subtle: #ddd9d1;
  --border-default: #c5bfb5;

  --success: #1a8f58;
  --success-bg: #edfaf3;
  --warning: #d97706;
  --warning-bg: #fff8ec;
  --danger: #dc2626;
  --danger-bg: #fef2f2;

  --r-sm: 6px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 26px;
  --r-pill: 9999px;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.12);

  --t: 170ms cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-body);
  background: #dedbd4;
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
}

/* OUTER CHROME */
.shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar-proto {
  height: 52px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.proto-logo {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.proto-nav {
  display: flex;
  gap: 3px;
}

.pnb {
  padding: 5px 14px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  transition: all var(--t);
}

.pnb:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.pnb.active {
  background: var(--brand-500);
  color: #fff;
}

.theme-btn {
  padding: 6px 16px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid var(--brand-500);
  background: var(--brand-500);
  color: #fff;
  transition: all var(--t);
  display: flex;
  align-items: center;
  gap: 6px;
}

.theme-btn:hover {
  background: var(--brand-600);
  border-color: var(--brand-600);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.screens-area {
  flex: 1;
  padding: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.screen-block {
  width: 100%;
  max-width: 1120px;
  animation: fadeUp 0.4s ease both;
}

.screen-lbl {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.screen-lbl::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-subtle);
}

.screen-frame {
  background: var(--bg-base);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.05);
}

/* APP SHELL */
.app {
  display: flex;
  height: 700px;
}

/* SIDEBAR */
.sidebar {
  width: 216px;
  flex-shrink: 0;
  background: var(--bg-elevated);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

.sb-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

.sb-logo {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 52px;
  padding: 0 18px;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-primary);
  text-decoration: none;
}

.sb-sec {
  padding: 14px 18px 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-disabled);
}

.sb-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 18px;
  margin: 1px 6px;
  border-radius: var(--r-md);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--t);
  text-decoration: none;
}

.sb-item:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.sb-item.on {
  background: var(--brand-50);
  color: var(--brand-600);
}

.sb-ic {
  width: 18px;
  text-align: center;
  font-size: 14px;
}

.sb-badge {
  margin-left: auto;
  background: var(--brand-500);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: var(--r-pill);
}

.sb-bot {
  margin-top: auto;
  padding: 10px 6px;
  border-top: 1px solid var(--border-subtle);
  position: relative;
}

.sb-user {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 12px;
  border-radius: var(--r-md);
  cursor: pointer;
  transition: background var(--t);
  min-width: 0;
}

.sb-user:hover {
  background: var(--bg-subtle);
}

/* MAIN */
.main {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg-base);
}

.topbar {
  height: 52px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.tb-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  width: 32px;
  height: 32px;
  padding: 0;
  background: transparent;
  border: none;
  cursor: pointer;
}

.hamburger span {
  display: block;
  width: 18px;
  height: 2px;
  background: var(--text-secondary);
  border-radius: 2px;
  transition: all var(--t);
}

.hamburger:hover span {
  background: var(--text-primary);
}

.tb-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.tb-actions {
  display: flex;
  align-items: center;
  gap: 7px;
}

.body {
  padding: 20px 24px;
  overflow-y: auto;
  flex: 1;
}

/* AVATAR */
.avatar {
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  flex-shrink: 0;
}

.avatar-sm {
  width: 28px;
  height: 28px;
  font-size: 11px;
}

.avatar-md {
  width: 36px;
  height: 36px;
  font-size: 13px;
}

.avatar-lg {
  width: 44px;
  height: 44px;
  font-size: 16px;
}

.avatar-green {
  background: var(--brand-100);
  color: var(--brand-700);
}

.avatar-peach {
  background: #ffe8dc;
  color: #c05030;
}

.avatar-teal {
  background: #d0f0ee;
  color: #1a7a76;
}

.avatar-amber {
  background: #fff0cc;
  color: #a06010;
}

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 15px;
  border-radius: var(--r-md);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all var(--t);
  white-space: nowrap;
}

.btn-primary {
  background: var(--brand-500);
  color: #fff;
}

.btn-primary:hover {
  background: var(--brand-600);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.btn-secondary {
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
}

.btn-secondary:hover {
  border-color: var(--brand-500);
  color: var(--brand-500);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
}

.btn-ghost:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.btn-xs {
  padding: 5px 11px;
  font-size: 12px;
  border-radius: var(--r-sm);
}

.btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-md);
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 14px;
  transition: all var(--t);
}

.btn-icon:hover {
  border-color: var(--brand-500);
  color: var(--brand-500);
}

/* CARD */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  padding: 18px;
}

.card-sm {
  padding: 13px 15px;
  border-radius: var(--r-md);
}

/* BADGE */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.03em;
  padding: 2px 8px;
  border-radius: var(--r-pill);
}

.badge-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.badge-ok {
  background: var(--success-bg);
  color: var(--success);
}

.badge-ok .badge-dot {
  background: var(--success);
}

.badge-warn {
  background: var(--warning-bg);
  color: var(--warning);
}

.badge-warn .badge-dot {
  background: var(--warning);
}

.badge-err {
  background: var(--danger-bg);
  color: var(--danger);
}

.badge-err .badge-dot {
  background: var(--danger);
}

.badge-neutral {
  background: var(--bg-subtle);
  color: var(--text-secondary);
}

.badge-brand {
  background: var(--brand-50);
  color: var(--brand-600);
}

.badge-teal {
  background: #d0f0ee;
  color: #1a7a76;
}

.badge-amber {
  background: #fff0cc;
  color: #a06010;
}

/* PROGRESS */
.prog-track {
  height: 6px;
  background: var(--bg-subtle);
  border-radius: var(--r-pill);
  overflow: hidden;
}

.prog-bar {
  height: 100%;
  border-radius: var(--r-pill);
  background: var(--brand-500);
  transition: width var(--t);
}

.prog-bar-warn {
  background: var(--warning);
}

.prog-bar-err {
  background: var(--danger);
}

/* INPUT */
.input {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  padding: 8px 12px;
  width: 100%;
  outline: none;
  transition: all var(--t);
}

.input:focus {
  border-color: var(--brand-500);
  box-shadow: 0 0 0 3px rgba(26,143,88,0.1);
}

.input::placeholder {
  color: var(--text-disabled);
}

.label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 4px;
  display: block;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* DIVIDER */
.divider {
  height: 1px;
  background: var(--border-subtle);
  margin: 14px 0;
}

/* GRID */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

/* STAT CARD */
.stat-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  padding: 16px;
}

.stat-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 5px;
}

.stat-value {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.stat-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 3px;
}

.positive {
  color: var(--success);
  font-weight: 600;
}

.negative {
  color: var(--danger);
  font-weight: 600;
}

.warning {
  color: var(--warning);
  font-weight: 600;
}

/* HERO CARD */
.hero-card {
  background: linear-gradient(135deg, var(--brand-600), var(--brand-800));
  color: #fff;
  border-radius: var(--r-xl);
  padding: 22px 26px;
  position: relative;
  overflow: hidden;
  margin-bottom: 16px;
}

.hero-card::before {
  content: '';
  position: absolute;
  top: -50px;
  right: -50px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
}

.hero-card::after {
  content: '';
  position: absolute;
  bottom: -70px;
  right: 50px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: rgba(255,255,255,0.04);
}

.hero-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 5px;
}

.hero-amount {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 3px;
}

.hero-sub {
  font-size: 12px;
  opacity: 0.6;
}

.hero-chips {
  display: flex;
  gap: 16px;
  margin-top: 14px;
  position: relative;
  z-index: 1;
}

.hero-chip {
  opacity: 0.8;
}

.hero-chip-label {
  font-size: 10px;
  opacity: 0.65;
}

.hero-chip-value {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
}

/* TX ITEM */
.tx-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);
}

.tx-item:last-child {
  border-bottom: none;
}

.tx-icon {
  width: 34px;
  height: 34px;
  border-radius: var(--r-md);
  background: var(--bg-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}

.tx-meta {
  flex: 1;
}

.tx-name {
  font-size: 13px;
  font-weight: 500;
}

.tx-date {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 1px;
}

.tx-amount {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  text-align: right;
}

.tx-amount.negative {
  color: var(--danger);
}

.tx-amount.positive {
  color: var(--success);
}

.tx-sub {
  font-size: 10px;
  text-align: right;
  margin-top: 2px;
}

/* BUDGET MINI */
.budget-mini {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  padding: 15px;
  cursor: pointer;
  transition: all var(--t);
}

.budget-mini:hover {
  border-color: var(--brand-400);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.bm-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.bm-icon {
  font-size: 18px;
}

.bm-name {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 2px;
}

.bm-amount {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 2px;
}

.bm-target {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 8px;
}

.bm-foot {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--text-tertiary);
  margin-top: 5px;
}

/* CC VISUAL */
.cc-visual {
  background: linear-gradient(135deg, #2d3a4a, #1a2535);
  border-radius: var(--r-xl);
  padding: 18px 20px;
  color: #fff;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 160px;
}

.cc-visual::before {
  content: '';
  position: absolute;
  top: -30px;
  right: -30px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
}

.cc-num {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.14em;
  opacity: 0.75;
}

.cc-bot {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.cc-holder {
  font-size: 11px;
  font-weight: 500;
  opacity: 0.65;
}

.cc-exp-lbl {
  font-size: 8px;
  opacity: 0.45;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.cc-exp {
  font-family: var(--font-mono);
  font-size: 11px;
}

.cc-net {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.04em;
  opacity: 0.8;
}

/* TAG */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: var(--r-pill);
}

.tag-link {
  background: var(--brand-50);
  color: var(--brand-600);
  border: 1px solid var(--brand-100);
}

.tag-receivable {
  background: var(--success-bg);
  color: var(--success);
  border: 1px solid var(--brand-200);
}

.tag-dash {
  border: 1px dashed var(--border-default);
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all var(--t);
}

.tag-dash:hover {
  border-color: var(--brand-400);
  color: var(--brand-500);
}

/* RING CHART */
.ring-wrap {
  position: relative;
  width: 110px;
  height: 110px;
  flex-shrink: 0;
}

.ring-wrap svg {
  transform: rotate(-90deg);
}

.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.ring-value {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
}

.ring-label {
  font-size: 9px;
  color: var(--text-tertiary);
}

.legend {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}

.legend-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.legend-name {
  font-size: 11px;
  color: var(--text-secondary);
  flex: 1;
}

.legend-value {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-primary);
}

/* SEGMENTED */
.segmented {
  display: flex;
  background: var(--bg-subtle);
  border-radius: var(--r-md);
  padding: 3px;
}

.segmented-btn {
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  transition: all var(--t);
}

.segmented-btn.on {
  background: var(--bg-elevated);
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
}

/* RECEIVABLE ITEM */
.receivable-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 13px;
  border-radius: var(--r-md);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  margin-bottom: 7px;
  cursor: pointer;
  transition: all var(--t);
}

.receivable-item:hover {
  border-color: var(--brand-400);
}

.receivable-item:last-child {
  margin-bottom: 0;
}

.ri-who {
  flex: 1;
}

.ri-name {
  font-size: 13px;
  font-weight: 600;
}

.ri-desc {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 1px;
}

.ri-right {
  text-align: right;
}

.ri-amount {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--success);
}

/* CC DETAIL ROW */
.cc-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--border-subtle);
}

.cc-row:last-child {
  border-bottom: none;
}

.cc-row-label {
  font-size: 11px;
  color: var(--text-tertiary);
}

.cc-row-value {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
}

.copy-btn {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: all var(--t);
}

.copy-btn:hover {
  background: var(--brand-50);
  color: var(--brand-600);
  border-color: var(--brand-300);
}

/* REWARD BAR */
.reward-bar {
  background: var(--bg-subtle);
  border-radius: var(--r-lg);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.reward-points {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  color: var(--brand-500);
}

.reward-label {
  font-size: 11px;
  color: var(--text-secondary);
}

.reward-sub {
  font-size: 10px;
  color: var(--text-tertiary);
}

/* MODAL */
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(28,25,22,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-xl);
}

.modal {
  background: var(--bg-elevated);
  border-radius: var(--r-xl);
  padding: 28px;
  width: 400px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-subtle);
}

.modal-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 5px;
}

.modal-sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 20px;
  line-height: 1.5;
}

.choice {

  border-radius: var(--r-lg);
  padding: 14px 16px;
  cursor: pointer;
  transition: all var(--t);
  margin-bottom: 9px;
  display: flex;
  gap: 12px;
}

.choice:hover {
  border-color: var(--brand-400);
}

.choice.sel {
  border-color: var(--brand-500);
  background: var(--brand-50);
}

.choice-icon {
  font-size: 22px;
  flex-shrink: 0;
  margin-top: 2px;
}

.choice-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 3px;
}

.choice-desc {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.5;
}

.modal-footer {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  justify-content: flex-end;
}

  padding: 11px 24px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.alloc-label {

  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 5px;
}

.alloc-track {
  display: flex;
  height: 7px;
  border-radius: var(--r-pill);
  overflow: hidden;
  gap: 1px;

[data-theme="dark"] {
  --bg-base: #141210;
  --bg-surface: #1e1c19;
  --bg-elevated: #28251f;
  --bg-subtle: #2e2b24;

[data-theme="dark"] body {

/* RESPONSIVE */

function showScreen(name, btn) {
  const area = document.getElementById('area');
  const labels = {dashboard:'01 — Dashboard',budget:'02 — Budget Accounts',cards:'03 — Credit Cards',receivables:'04 — Receivables',collab:'05 — Collaboration'};
  area.innerHTML = `<div class="screen-block"><div class="screen-lbl">${labels[name]}</div><div class="screen-frame">${SCREENS[name]}</div></div>`;
  document.querySelectorAll('.pnb').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

function pickChoice(el){
  document.querySelectorAll('.choice').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
}

function toggleTheme(){
  const h=document.documentElement;
  const next=h.getAttribute('data-theme')==='light'?'dark':'light';
  h.setAttribute('data-theme',next);
  document.getElementById('themebtn').textContent=next==='dark'?'☀️ Light':'🌙 Dark';
}

function toggleSidebar(id) {
  const sidebar = document.getElementById(id);
  if (sidebar) {
    sidebar.classList.toggle('open');
  }
}

// boot
document.querySelector('.pnb').click();
</script>
</body>
</html>
